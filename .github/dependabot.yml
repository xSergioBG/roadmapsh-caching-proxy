version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '07:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    groups:
      compatible-updates:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '07:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    groups:
      compatible-updates:
        patterns: ['*']
        update-types: [minor, patch]
